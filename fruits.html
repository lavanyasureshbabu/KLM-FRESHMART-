<!DOCTYPE html>
<html>
<head>
  <title>Fruits - KLM Freshmart</title>
  <style>
    body{text-align:center;background:#fff0f5;font-family:Arial}
    table{margin:auto;border-collapse:collapse}
    th{background:#ff7e5f;color:white;padding:5px}
    td{padding:5px;text-align:center}
  </style>
</head>
<body>
<h1>Fruits 🍎</h1>
<table border="1">
<tr><th>Item</th><th>Qty (kg)</th><th>Price (₹)</th><th></th></tr>
<script>
let cart=[],f=[{n:"Apple",p:60},{n:"Banana",p:30},{n:"Orange",p:50},{n:"Mango",p:120},{n:"Pineapple",p:80}];
f.forEach(x=>{
  document.write(`<tr><td>${x.n}</td><td><input type="number" value="0.5" min="0.5" step="0.5" onchange="this.nextElementSibling.innerText=this.value*${x.p}"></td><td>${x.p}</td><td><button onclick="cart.push({n:'${x.n}',q:this.previousElementSibling.value,p:this.previousElementSibling.value*${x.p}});showCart()">Add</button></td></tr>`);
});
function showCart(){
  let t='<h2>Cart</h2><table border="1" align="center"><tr><th>Item</th><th>Qty</th><th>Price</th></tr>';
  cart.forEach(i=>t+=`<tr><td>${i.n}</td><td>${i.q}</td><td>${i.p}</td></tr>`);
  t+='</table>';document.getElementById('c').innerHTML=t;
}
</script>
</table>
<div id="c"></div>
</body>
</html>
