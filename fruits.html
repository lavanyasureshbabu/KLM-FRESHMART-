<!DOCTYPE html>
<html>
<head>
  <title>Fruits - KLM Freshmart</title>
  <style>
    body{text-align:center;background:#fff0f5;font-family:Arial}
    table{margin:auto;border-collapse:collapse}
    th{background:#ff7e5f;color:white;padding:5px}
    td{padding:5px;text-align:center}
  </style>
</head>
<body>
<h1>Fruits 🍎</h1>
<table border="1">
<tr><th>Fruit</th><th>Qty (kg)</th><th>Price (₹)</th><th></th></tr>
<tbody id="fruitTable"></tbody>
</table>
<h2>Cart</h2>
<div id="cart"></div>

<script>
let cart=[];
let fruits=[
{n:"Apple",p:60},{n:"Banana",p:30},{n:"Orange",p:50},{n:"Mango",p:120},{n:"Pineapple",p:80},
{n:"Grapes",p:90},{n:"Papaya",p:70},{n:"Strawberry",p:150},{n:"Blueberry",p:200},{n:"Watermelon",p:40},
{n:"Kiwi",p:130},{n:"Guava",p:60},{n:"Litchi",p:140},{n:"Cherry",p:220},{n:"Pear",p:100},
{n:"Peach",p:120},{n:"Plum",p:90},{n:"Pomegranate",p:100},{n:"Fig",p:200},{n:"Apricot",p:180},
{n:"Cantaloupe",p:80},{n:"Raspberry",p:220},{n:"Blackberry",p:200},{n:"Tangerine",p:70},{n:"Dragonfruit",p:250}
];

let table=document.getElementById('fruitTable');
fruits.forEach((f,i)=>{
  let tr=document.createElement('tr');

  let tdName=document.createElement('td');
  tdName.innerText=f.n;
  tr.appendChild(tdName);

  let tdQty=document.createElement('td');
  let input=document.createElement('input');
  input.type='number';
  input.value=0.5;
  input.min=0.5;
  input.step=0.5;
  tdQty.appendChild(input);
  tr.appendChild(tdQty);

  let tdPrice=document.createElement('td');
  tdPrice.innerText=f.p*input.value;
  tr.appendChild(tdPrice);

  input.oninput=function(){tdPrice.innerText=f.p*input.value;};

  let tdButton=document.createElement('td');
  let btn=document.createElement('button');
  btn.innerText='Add';
  btn.onclick=function(){
    cart.push({name:f.n,qty:input.value,price:f.p*input.value});
    updateCart();
  };
  tdButton.appendChild(btn);
  tr.appendChild(tdButton);

  table.appendChild(tr);
});

function updateCart(){
  let html='<table border="1" style="margin:auto"><tr><th>Item</th><th>Qty</th><th>Price</th></tr>';
  cart.forEach(c=>html+=`<tr><td>${c.name}</td><td>${c.qty}</td><td>${c.price}</td></tr>`);
  html+='</table>';
  document.getElementById('cart').innerHTML=html;
}
</script>
</body>
</html>
