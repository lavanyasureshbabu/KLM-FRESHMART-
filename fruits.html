<!DOCTYPE html>
<html>
<head>
    <title>Fruits - KLM Freshmart</title>
</head>
<body>
<h1>Available Fruits 🍎</h1>
<table border="1" cellspacing="0" cellpadding="5" align="center">
<tr><th>Fruit Name</th><th>Quantity (kg)</th><th>Price (₹)</th></tr>
<script>
const fruits=[{n:"Apple",p:60},{n:"Banana",p:30},{n:"Orange",p:50},{n:"Mango",p:120},{n:"Pineapple",p:80},{n:"Guava",p:40},{n:"Papaya",p:55},{n:"Watermelon",p:35},{n:"Muskmelon",p:60},{n:"Strawberry",p:150},{n:"Blueberry",p:200},{n:"Cherry",p:180},{n:"Peach",p:90},{n:"Pear",p:70},{n:"Plum",p:75},{n:"Apricot",p:110},{n:"Kiwi",p:130},{n:"Pomegranate",p:95},{n:"Lemon",p:20},{n:"Lime",p:25},{n:"Jackfruit",p:90},{n:"Cantaloupe",p:65},{n:"Raspberry",p:180},{n:"Blackberry",p:170},{n:"Dragonfruit",p:250}];
fruits.forEach(f=>document.write(`<tr><td>${f.n}</td><td><input type="number" value="0.5" min="0.5" step="0.5"></td><td>${f.p}</td></tr>`));
</script>
</table>
</body>
</html>
