<!DOCTYPE html>
<html>
<head>
  <title>Webpage Layout</title>

  <style>
    /* General Styling */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Header */
    header {
      background-color: #4CAF50;
      color: white;
      padding: 20px;
      text-align: center;
      border: 2px solid black; /* Box model */
    }

    /* Navigation */
    nav {
      background-color: #333;
      padding: 10px;
    }

    nav ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }

    nav ul li {
      display: inline;
      margin-right: 20px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      padding: 8px;
    }

    nav ul li a:hover {
      background-color: #555;
      border-radius: 5px;
    }

    /* Main Container */
    .container {
      display: flex;
      position: relative; /* positioning */
    }

    /* Content Section */
    .content {
      width: 70%;
      padding: 20px;
      margin: 10px;
      border: 2px solid black;
      outline: 3px dashed red; /* outline effect */
    }

    /* Sidebar */
    .sidebar {
      width: 30%;
      padding: 20px;
      margin: 10px;
      border: 2px solid black;
      background-color: #f4f4f4;

      position: relative;
      top: 10px; /* positioning */
    }

    /* Footer */
    footer {
      background-color: #222;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 10px;
      border: 2px solid black;
    }

  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <h1>My Website</h1>
  </header>

  <!-- Navigation -->
  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <div class="container">

    <!-- Content Section -->
    <div class="content">
      <h2>Main Content</h2>
      <p>This is the main content area of the webpage.</p>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <h3>Sidebar</h3>
      <p>This is the sidebar section.</p>
    </div>

  </div>

  <!-- Footer -->
  <footer>
    <p>© 2026 My Website</p>
  </footer>

</body>
</html>
